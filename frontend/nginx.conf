server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default (1m) rejects a typical phone receipt photo outright.
    client_max_body_size 20m;

    # API is same-origin in production: nginx proxies /api to the backend service.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static (admin, DRF browsable API) served by the backend/whitenoise.
    # Host must be forwarded here too — without it Django sees "backend:8000" as
    # the Host, which isn't in ALLOWED_HOSTS, and 400s every request.
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }

    # Served directly from the shared `media` volume, not proxied to Django —
    # Django's own media serving (the static() urls.py helper) only works when
    # DEBUG=True, so in production nothing would serve these otherwise.
    location /media/ {
        alias /media/;
    }

    # SPA fallback: any unknown path returns index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
