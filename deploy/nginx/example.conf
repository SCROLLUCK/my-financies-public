# Example host-level nginx vhost: reverse proxies everything to the frontend
# container, which has its own internal nginx (frontend/nginx.conf) handling
# /api, /static, /media and SPA routing. Replace your-domain.com and add TLS
# (e.g. `certbot --nginx -d your-domain.com`).

server {
    listen 80;
    server_name your-domain.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
