# Development stack: builds locally, mounts source for hot-reload.
# Usage: docker compose -f docker-compose.dev.yml up --build
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  whatsapp:
    build: ./whatsapp
    restart: always
    environment:
      LOG_LEVEL: ${WHATSAPP_LOG_LEVEL:-warn}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      WA_INBOUND_SECRET: ${WA_INBOUND_SECRET:-}
    volumes:
      - ./whatsapp:/app
      - /app/node_modules
      - whatsapp_auth:/app/auth
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-America/Sao_Paulo}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:15173}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WHATSAPP_GATEWAY_URL: ${WHATSAPP_GATEWAY_URL:-http://whatsapp:3000}
      WA_INBOUND_SECRET: ${WA_INBOUND_SECRET:-}
      PARTNER_WHATSAPP_NAME: ${PARTNER_WHATSAPP_NAME:-}
    volumes:
      - ./backend:/app
      - media:/app/media
    ports:
      - "18000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    restart: always
    environment:
      VITE_API_URL: /api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "15173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  whatsapp_auth:
