# Production stack: pulls pre-built images from GitLab's container registry
# (published by CI on push to main). Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  whatsapp:
    image: registry.gitlab.com/${IMAGE_OWNER:?set IMAGE_OWNER}/my-finances/whatsapp:${IMAGE_TAG:-latest}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      WA_INBOUND_SECRET: ${WA_INBOUND_SECRET:-}
    volumes:
      - whatsapp_auth:/app/auth
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  backend:
    image: registry.gitlab.com/${IMAGE_OWNER:?set IMAGE_OWNER}/my-finances/backend:${IMAGE_TAG:-latest}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py ensure_superuser &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-America/Sao_Paulo}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WHATSAPP_GATEWAY_URL: ${WHATSAPP_GATEWAY_URL:-http://whatsapp:3000}
      WA_INBOUND_SECRET: ${WA_INBOUND_SECRET:-}
      PARTNER_WHATSAPP_NAME: ${PARTNER_WHATSAPP_NAME:-}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    image: registry.gitlab.com/${IMAGE_OWNER:?set IMAGE_OWNER}/my-finances/frontend:${IMAGE_TAG:-latest}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "${FRONTEND_PORT:-18080}:80"
    volumes:
      - media:/media:ro
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
  media:
  staticfiles:
  whatsapp_auth:
